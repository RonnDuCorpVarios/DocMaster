name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la web
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Generar proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Aplicar icono, pantalla de inicio, versión y firma
        run: node scripts/apply-android.mjs

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Comprobar icono dentro del APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|application-label:|application-icon" || true
          unzip -l "$APK" | grep -i "ic_launcher" || true

      - name: Nombrar APK
        run: |
          V=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk "DocMaster-v$V.apk"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: DocMaster-APK
          path: DocMaster-v${{ env.APP_VERSION }}.apk
