<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lector</title>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">L</div>
    <div class="brand"><b>Lector</b><span id="fname">Word, Excel, PowerPoint y PDF</span></div>
    <div class="sp"></div>
    <button class="icon" id="theme" aria-label="Cambiar tema">☾</button>
  </header>

  <main id="views">
    <section class="view on" id="v-home">
      <div class="hero">
        <h1>Abre un documento</h1>
        <p>Word, Excel, PowerPoint o PDF. Se abre en tu teléfono, sin enviar nada a internet.</p>
        <label class="btn primary big" for="file">Elegir archivo</label>
        <input id="file" type="file" hidden>
      </div>
      <div id="recent-wrap" hidden>
        <div class="sec"><h2>Recientes</h2><button class="link" id="seeall">Ver todo</button></div>
        <div class="list" id="recent"></div>
      </div>
    </section>

    <section class="view" id="v-doc">
      <div class="stick">
        <div class="bar">
          <span class="badge" id="badge"></span>
          <span class="meta" id="meta"></span>
          <span class="sp"></span>
          <span id="tools"></span>
          <button class="icon" id="sbtn" aria-label="Buscar en el documento">⌕</button>
          <button class="icon" id="close" aria-label="Cerrar documento">✕</button>
        </div>
        <div class="sbar" id="sbar" hidden>
          <input id="sq" type="search" placeholder="Buscar palabra…" autocomplete="off" enterkeyhint="search">
          <span class="count" id="scount"></span>
          <button class="icon" id="sprev" aria-label="Anterior">↑</button>
          <button class="icon" id="snext" aria-label="Siguiente">↓</button>
        </div>
      </div>
      <div id="load" hidden><div class="spin"></div><span id="loadtxt">Abriendo…</span></div>
      <div id="out"></div>
    </section>

    <section class="view" id="v-hist">
      <div class="sec"><h2>Historial</h2><button class="link" id="clearh">Borrar todo</button></div>
      <input id="hq" class="field" type="search" placeholder="Buscar por nombre…" autocomplete="off">
      <div class="list" id="hlist"></div>
    </section>
  </main>

  <nav>
    <button id="n-read" class="on"><span>▤</span>Lector</button>
    <button id="n-hist"><span>◷</span>Historial</button>
  </nav>
  <div id="toast"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
